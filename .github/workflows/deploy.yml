name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 一次只跑一個部署；不取消進行中的部署，避免半途中斷留下壞掉的站。
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: 建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      # 部署前再跑一次完整驗證：master 上不該出現沒過關的產物。
      - name: 型別檢查
        run: pnpm typecheck

      - name: 單元測試
        run: pnpm test

      - name: 建置
        run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
