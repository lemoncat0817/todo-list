name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 型別 / lint / 單元測試 / 建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 型別檢查
        run: pnpm typecheck

      # --max-warnings 0：稽核的 P6/P7 無障礙問題已全數修正，
      # 從此任何新警告都會讓建置失敗。
      - name: Lint
        run: pnpm lint --max-warnings 0

      - name: 單元測試
        run: pnpm test

      - name: 建置
        # VITE_SUPABASE_URL／ANON_KEY 沒設定時就是空字串，等同沒接雲端同步——
        # 帳號與同步入口整個不顯示（見 src/sync/config.ts 的 isSyncConfigured），
        # 建置照樣完整成功。這兩個值本來就是給前端打包用的公開設定，
        # ANON_KEY 也是設計上可公開的（真正的存取控制在 supabase/migrations 的 RLS），
        # 用 secret 存放只是維持一致的謹慎程度。
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 上傳建置產物
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E（Playwright）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 安裝 Chromium
        run: pnpm exec playwright install --with-deps chromium

      # E2E 已含 e2e/a11y.spec.ts：WCAG 2.1 AA 全畫面零違規（含對比度），
      # 任何無障礙回歸都會在此擋下。
      - name: 執行 E2E（含無障礙檢測）
        run: pnpm test:e2e

      # 失敗時把報告與 trace/截圖/影片一起帶出來。
      # 先前只上傳 playwright-report，但 config 沒設 html reporter，
      # 那個目錄根本不存在——CI 失敗時只看得到「E2E 失敗」四個字。
      - name: 失敗時上傳報告與 trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: warn
